<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <title>FreeMedium</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <img src="../icons/icon-48.png" alt="FreeMedium" class="brand-logo" width="26" height="26">
        <div>
          <h1 class="brand-title">FreeMedium</h1>
          <p class="brand-subtitle" data-i18n="app.subtitle">Ad-Free Paywall Unlocker</p>
        </div>
      </div>
      <span id="status-pill" class="status-pill" data-i18n="status.ready">Ready</span>
    </header>

    <!-- Primary Current Tab Action Card -->
    <section class="card action-card">
      <div class="current-page-info">
        <span class="info-label" data-i18n="currentTab.label">Current Tab</span>
        <span id="current-host" class="current-host" data-i18n="currentTab.detecting">Detecting...</span>
      </div>
      <div class="primary-actions">
        <button id="btn-unlock-current" class="btn btn-primary" type="button">
          <span aria-hidden="true">🔓</span>
          <span id="btn-unlock-label" data-i18n="unlock.current">Unlock Current Tab</span>
        </button>
        <button id="btn-copy-md" class="btn btn-secondary" type="button" title="Copy article as Markdown (Alt+M)" data-i18n-title="copy.title">
          <span aria-hidden="true">📋</span>
          <span data-i18n="copy.markdown">Markdown</span>
        </button>
        <button id="btn-bookmark" class="btn btn-icon" type="button" title="Save to bookmarks" data-i18n-title="bookmark.save">
          <span id="bookmark-icon" aria-hidden="true">☆</span>
        </button>
      </div>

      <!-- Mirror Selector -->
      <div class="mirror-row">
        <label for="select-mirror" class="mirror-label" data-i18n="mirror.label">Active Mirror</label>
        <select id="select-mirror" class="mirror-select">
          <option value="freedium_mirror" data-i18n="mirror.freediumMirror">Freedium Mirror (freedium-mirror.cfd)</option>
          <option value="freedium" data-i18n="mirror.freedium">Freedium (freedium.cfd)</option>
          <option value="freedium_web" data-i18n="mirror.freediumWeb">Freedium Web (Vercel)</option>
          <option value="archive_newest" data-i18n="mirror.archiveNewest">Archive.is (Newest)</option>
          <option value="archive_oldest" data-i18n="mirror.archiveOldest">Archive.is (Oldest)</option>
        </select>
      </div>

      <!-- Manual URL Input (Collapsible or subtle) -->
      <div class="manual-input-row">
        <input id="input-custom-url" type="url" class="url-input" placeholder="Or paste any article URL to unlock..." data-i18n-placeholder="url.placeholder">
        <button id="btn-paste-unlock" class="btn btn-small" type="button" data-i18n="url.go">Go</button>
      </div>
    </section>

    <!-- Smart Automation Settings -->
    <section class="card settings-card">
      <h2 class="section-title" data-i18n="settings.title">Smart Automation &amp; Purification</h2>
      <div class="mirror-row"><label for="select-language" class="mirror-label" data-i18n="toggle.language.name">Language</label><select id="select-language" class="mirror-select"><option value="auto" data-i18n="language.auto">Auto (browser)</option><option value="en" data-i18n="language.en">English</option><option value="zh_CN" data-i18n="language.zh">简体中文</option></select></div>
      <div class="toggle-list">
        <label class="toggle-item">
          <div class="toggle-text">
            <span class="toggle-name" data-i18n="toggle.autoUnlock.name">Auto-Unlock on Paywall</span>
            <span class="toggle-desc" data-i18n="toggle.autoUnlock.desc">Automatically redirect when a locked story is detected</span>
          </div>
          <input id="toggle-auto-unlock" type="checkbox" switch>
        </label>

        <label class="toggle-item">
          <div class="toggle-text">
            <span class="toggle-name" data-i18n="toggle.floating.name">Floating Unlock Pill</span>
            <span class="toggle-desc" data-i18n="toggle.floating.desc">Show 1-click "Unlock" button on Medium &amp; 6 publishers</span>
          </div>
          <input id="toggle-floating-btn" type="checkbox" switch>
        </label>

        <label class="toggle-item">
          <div class="toggle-text">
            <span class="toggle-name" data-i18n="toggle.fallback.name">Auto-Fallback Mirror</span>
            <span class="toggle-desc" data-i18n="toggle.fallback.desc">Switch mirror automatically if current mirror fails/times out</span>
          </div>
          <input id="toggle-auto-fallback" type="checkbox" switch>
        </label>

        <label class="toggle-item">
          <div class="toggle-text">
            <span class="toggle-name" data-i18n="toggle.purify.name">Purify Mirror Popups &amp; Ads</span>
            <span class="toggle-desc" data-i18n="toggle.purify.desc">Hide donation banners and announcement toasts on mirrors</span>
          </div>
          <input id="toggle-hide-popups" type="checkbox" switch>
        </label>

        <label class="toggle-item">
          <div class="toggle-text">
            <span class="toggle-name" data-i18n="toggle.newTab.name">Open Unlocked in New Tab</span>
            <span class="toggle-desc" data-i18n="toggle.newTab.desc">Keep original article tab open when unlocking</span>
          </div>
          <input id="toggle-new-tab" type="checkbox" switch>
        </label>
      </div>
    </section>

    <!-- History & Saved Library -->
    <section class="card library-card">
      <div class="tabs-header">
        <div class="tabs-group" role="tablist">
          <button id="tab-recent" class="tab-btn active" role="tab" aria-selected="true" type="button" data-i18n="tab.recent">Recent</button>
          <button id="tab-saved" class="tab-btn" role="tab" aria-selected="false" type="button" data-i18n="tab.saved">Saved ★</button>
        </div>
        <button id="btn-clear-list" class="clear-link" type="button" title="Clear current list" data-i18n-title="clear.title" data-i18n="clear.label">Clear</button>
      </div>
      <ul id="library-list" class="library-list"></ul>
    </section>

    <div id="popup-toast" class="popup-toast" role="status" aria-live="polite"></div>
  </div>
  <script src="../lib/i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
